<div class="admin-bar">
  <span>🔐 Admin mode · signed in as <b>{{ user.username }}</b> · ends after {{ ttl }} min of inactivity</span>
  <form method="post" action="{{ url_for('admin.logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn danger">Leave admin mode</button>
  </form>
</div>
